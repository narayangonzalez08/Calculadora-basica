<!DOCTYPE html>
<html>
    <head>
        <title> Calculadora</title>
        <link rel="stylesheet" href="Calculadora con estilo.css">
    </head>

    <body>
        <div class="Calculadora">
            <input type="text" id="pantalla" readonly>
            <div class="botones">
                <button>7</button>
                <button>8</button>
                <button>9</button>
                <button>/</button>

                <button>4</button>
                <button>5</button>
                <button>6</button>
                <button>*</button>

                <button>1</button>
                <button>2</button>
                <button>3</button>
                <button>-</button>

                <button>C</button>
                <button>0</button>
                <button id="red">=</button>
                <button>+</button>
            </div>
        </div>
        <script src="Calculadora funcional.js"></script>
    </body>
</html>
